<style>
html,body{height:100%;margin:0;background:#0B1A2C;overflow:hidden}
#fit{position:fixed;left:50%;top:50%;width:1280px;height:800px;transform-origin:center center}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.tilt{animation:tilt 2.2s ease-in-out infinite alternate}

<script src="firebase-config.js"></script>

<body>
<div id="fit"><div id="app"></div></div>
<script>
  // Fill the screen: match the screen height and widen the scene to the screen's width.
  // Narrow screens (portrait phones, square windows) fall back to fitting the whole 1280x800 scene.
  (function () {
    var el = document.getElementById('fit');
    function fit() {
      var W = window.innerWidth, H = window.innerHeight, s, lw, lh = 800;
      var portrait = H > W * 1.15;
      if (portrait) {
        // tall screens: a 720-wide scene that fills the full height (sky above, controls below)
        lw = 720; s = W / lw; lh = Math.max(800, Math.round(H / s));
      } else {
        s = H / 800; lw = W / s;
        if (lw < 1280) { s = Math.min(W / 1280, H / 800); lw = 1280; }
        lw = Math.min(Math.round(lw), 2400);
      }
      el.style.width = lw + 'px'; el.style.height = lh + 'px';
      el.style.transform = 'translate(-50%, -50%) scale(' + s + ')';
      window.STAGE_W = lw; window.STAGE_H = lh;
      window.STAGE_PORTRAIT = portrait;
      window.dispatchEvent(new Event('stageresize'));
    }
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
    fit();
  })();
</script>
<script type="module" src="app.js"></script>
</body>
